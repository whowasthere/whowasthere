name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after build"
        required: false
        default: "true"

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Deps and compile
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Test
        run: mix test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'false')
    runs-on: ubuntu-latest
    environment: production
    env:
      PAY_MASTER_KEY: ${{ secrets.PAY_MASTER_KEY }}
    concurrency:
      group: deploy-production-whowasthere
      cancel-in-progress: false
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: PAY_MASTER_KEY
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ -z "${PAY_MASTER_KEY:-}" ]; then
              echo "PAY_MASTER_KEY production secret is missing"
              exit 1
            fi
            if grep -q '^PAY_MASTER_KEY=' .env; then
              sed -i "s|^PAY_MASTER_KEY=.*$|PAY_MASTER_KEY=$PAY_MASTER_KEY|" .env
            else
              printf '\nPAY_MASTER_KEY=%s\n' "$PAY_MASTER_KEY" >> .env
            fi
            chmod 600 .env
            export IMAGE_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
            echo "Deploying $IMAGE_TAG"
            echo "$IMAGE_TAG" > .image_tag
            docker compose pull
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --remove-orphans
            docker image prune -f

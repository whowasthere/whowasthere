        - button "Copy" [ref=e217] [cursor=pointer]
      - paragraph [ref=e218]: After settlement, one year is added to the plan. Calling either endpoint when the deposit address is empty only returns the current status; it cannot extend the plan twice. Every settled $30 gives the profile 500,000 monthly pageviews.
      - paragraph [ref=e219]:
        - text: There is no background blockchain watcher and no transaction ID to submit. Opening
        - code [ref=e220]: /pay
        - text: ","
        - code [ref=e221]: /renew
        - text: ", or"
        - code [ref=e222]: /new?pay=p_SECRET
        - text: checks and settles the Solana address. Card renewals are confirmed through Stripe webhooks.
      - paragraph [ref=e223]:
        - text: Email is optional. If you add an address (
        - code [ref=e224]: /new?email=
        - text: or
        - code [ref=e225]: /notify?pay=p_SECRET&email=
        - text: ), you receive a message when the trial or paid year is about to end, when it expires, and when usage reaches about 80% or 100% of the monthly pageview limit. Delivery uses your Postal server when
        - code [ref=e226]: POSTAL_URL
        - text: and
        - code [ref=e227]: POSTAL_API_KEY
        - text: are set, or Resend when
        - code [ref=e228]: RESEND_API_KEY
        - text: is set. Postal takes precedence when both are configured.

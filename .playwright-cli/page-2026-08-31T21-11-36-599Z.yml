        - text: . Pay more at once and the monthly limit grows by
        - strong [ref=e191]: 500,000 for every additional $30
        - text: ($60 → 1,000,000, $90 → 1,500,000). You get a
        - strong [ref=e192]: 7-day free trial
        - text: ; when the trial or paid year ends, new pageviews are discarded until you renew.

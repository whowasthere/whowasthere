      - heading "Renew" [level=3] [ref=e208]
      - paragraph [ref=e209]: Use the same payment link for the first year and every renewal.
      - paragraph [ref=e210]:
        - strong [ref=e211]: "Card:"
        - text: open the saved payment URL in a browser, choose $30 or more, and click
        - strong [ref=e212]: Pay by card
        - text: . Each successful checkout adds another year from the current expiration date, or from today if the plan has expired. It also raises the monthly limit in the same way as a USDC payment.

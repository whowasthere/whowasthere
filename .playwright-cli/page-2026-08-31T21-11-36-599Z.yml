      - heading "What is not stored" [level=2] [ref=e173]
      - paragraph [ref=e174]: IP addresses, User-Agent strings, cookies, and individual hits are never written to disk.
      - paragraph [ref=e175]: Uniques use a salt that rotates every UTC day, so the same person is not linked across days. A session lives in ETS for 30 minutes and keeps a short chain of pages and clicks (at most 8 steps). The dashboard shows the current chain while the session is open; when it expires, that finished sequence is counted once and the last page is an exit. Intermediate prefixes are not stored. Individual visit trails are not stored.
      - paragraph [ref=e176]:
        - text: SQLite holds
        - code [ref=e177]: sites
        - text: ","
        - code [ref=e178]: days
        - text: ","
        - code [ref=e179]: dims
        - text: ", and"
        - code [ref=e180]: hours
        - text: — aggregates only, typically kilobytes per site per day. Today’s HyperLogLog sketch (~4 KB) is kept so a restart does not reset the estimate; older days retain only the estimated count.
      - heading "Domain lock" [level=2] [ref=e181]
      - paragraph [ref=e182]:
        - text: The first visit (or

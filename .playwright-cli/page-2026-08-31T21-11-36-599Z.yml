        - code [ref=e185]: www.
        - text: . Later events from another origin are ignored. The collector still returns a
        - code [ref=e186]: "204"
        - text: response.
      - heading "Payment details" [level=2] [ref=e187]
      - paragraph [ref=e188]:
        - strong [ref=e189]: $30 a year
        - text: — by card (Stripe, when configured) or with USDC on Solana. One payment link covers unlimited sites with a shared limit of
